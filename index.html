<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nahla Nabil</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=IBM+Plex+Sans:wght@400;500&display=swap');

  :root{
    --ink:#0B1F33;
    --paper:#F6F7F4;
    --accent:#2F5C82;
    --line:#D8DBD3;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    text-align:center;
    padding:24px;
  }

  .mark{
    width:56px;
    height:56px;
    border-radius:10px;
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--accent);
    margin:0 auto 24px;
  }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:38px;
    letter-spacing:-0.01em;
    margin-bottom:10px;
  }

  p{
    font-size:15px;
    color:#5A5E55;
  }
</style>
</head>
<body>
  <div>
    <div class="mark">[NN]</div>
    <h1>Nahla Nabil</h1>
    <p>Backend AI Engineering, portfolio in progress.</p>
  </div>
</body>
</html>
